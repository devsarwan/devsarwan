
name: Update GitHub Contribution Analytics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-analytics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate contribution analytics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: devsarwan
          cards: contributions,lifetime,momentum,repositories
          output-dir: assets
          themes: light,dark
          palette: green
          commit: true
          commit-message: "chore: update GitHub contribution analytics"
