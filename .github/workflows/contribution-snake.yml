
name: Generate Contribution Snake

on:
  schedule:
    - cron: "35 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# IMPORTANT: Use the same concurrency group in both analytics workflows.
concurrency:
  group: github-profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: devsarwan
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg?palette=github
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit and push generated files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-snake.svg assets/github-snake-dark.svg

          if git diff --cached --quiet; then
            echo "No changes to contribution snake."
            exit 0
          fi

          git commit -m "chore: update contribution snake"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
